replication:
 - cite: "Kiljae Lee and Yuan Zhang. Leave-One-Out Stable Conformal Prediction. In The Thirteenth International Conference on Learning Representations (ICLR 2025), pp. 16210-16234, 2025."
 - bib:  lee2025loo
