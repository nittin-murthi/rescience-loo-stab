 - doi:  10.48550/arXiv.2504.12189

abstract: "This study reports a partial replication of Leave-One-Out Stable Conformal Prediction (LOO-StabCP) by Lee and Zhang (ICLR 2025). The primary methods were independently implemented in Python based on the paper; the public repository and conference supplement were then used to diagnose differences; the kernel implementation was added after consulting the supplement. Eight claims are evaluated across synthetic and real-data regression, neural networks, kernels, derandomized split conformal and screening. Empirical coverage and runtime comparisons for linear models, and shorter SGD intervals than replace-one stable conformal prediction, support the original claims. Numerical replication depends on settings not fully specified in the text, notably signal scaling, feature normalization, network training and kernel parameters. Under the recovered simulation settings, mean lengths differ from the original table by at most 2.4\\%. Comparative claims are mixed: LOO-StabCP has less variable lengths than split conformal but is not uniformly shorter, and its length advantage over derandomized methods reverses for real-data SGD under the text setup. Neural-network and kernel results are reproduced with qualifications; response centering largely removes the kernel gain in this synthetic design. In screening, observed mean false discovery proportions remain below their targets, but the power advantage over cfBH does not persist at q = 0.1 or 0.2 when a missing factor R = 15 is restored to the training-point stability bound. The study distinguishes numerical agreement from statistical equivalence and documents assumptions and unresolved discrepancies. The original authors were not contacted."

